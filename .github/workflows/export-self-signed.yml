name: export self-signed certificate (one-off)

# One-off, deleted after its single run: encrypts the macOS self-signed certificate (.p12 and its password) to an age
# recipient generated on the Mac that builds by hand when GitHub has no macOS runner, so that Mac signs with the same
# certificate. Only the recipient's private key, which never leaves that Mac, can read the artifact.
on:
  workflow_dispatch:
    inputs:
      recipient:
        description: age public key (age1…) of the Mac that will import the certificate
        required: true
        type: string

permissions: {}

jobs:
  export:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    steps:
      - name: Encrypt the certificate to the recipient
        env:
          RECIPIENT: ${{ inputs.recipient }}
          MAC_SELF_SIGNED_P12: ${{ secrets.MAC_SELF_SIGNED_P12 }}
          MAC_SELF_SIGNED_PASSWORD: ${{ secrets.MAC_SELF_SIGNED_PASSWORD }}
        run: |
          if ! [[ "$RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]]; then
            echo "::error::recipient must be an age public key"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends age > /dev/null
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          (umask 077 && printf '%s' "$MAC_SELF_SIGNED_P12" | base64 --decode > "$work/cert.p12" \
            && printf '%s' "$MAC_SELF_SIGNED_PASSWORD" > "$work/password")
          tar -C "$work" -cf - cert.p12 password | age -r "$RECIPIENT" -o "$RUNNER_TEMP/self-signed.tar.age"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: self-signed-encrypted
          path: ${{ runner.temp }}/self-signed.tar.age
          retention-days: 1
